[package]
name = "opengent-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop host (Tauri) for the agent runtime"

[lib]
name = "opengent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
agent-core.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "time"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
tracing.workspace = true
ts-rs.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "std"] }
