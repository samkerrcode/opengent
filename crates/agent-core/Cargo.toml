[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UI-independent agent runtime: providers, MCP, policy, storage, orchestration"

[features]
default = ["native-secrets", "mcp", "native-pdf"]
native-secrets = ["dep:keyring-core", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store"]
mcp = ["dep:rmcp", "dep:process-wrap", "dep:async-trait"]
# OS PDF renderers behind `pdf::PdfRasterizer` (CoreGraphics + ImageIO on macOS,
# Windows.Data.Pdf on Windows). Without it PDF attachments are rejected as unsupported.
native-pdf = [
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-core-graphics",
    "dep:objc2-image-io",
    "dep:windows",
]

[dependencies]
# `rc`: request-path image payloads are shared `Arc<str>`s (`ContentBlock::Image`).
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "process", "fs", "net", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
ts-rs.workspace = true
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"
reqwest.workspace = true
rustls.workspace = true
keyring-core = { version = "1.0.1", optional = true }
rmcp = { version = "3.6.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "which-command",
    "auth",
], optional = true }
# rmcp's `CredentialStore` is an `async_trait`; already in the lockfile via rmcp.
async-trait = { version = "=0.1.92", optional = true }
# Process-group / job-object wrappers so spawned MCP servers are killed wholesale,
# including grandchildren (`npx` -> `node`), on disconnect or app exit.
process-wrap = { version = "=10.0.1", default-features = false, features = [
    "tokio1",
    "kill-on-drop",
    "process-group",
    "job-object",
], optional = true }
base64 = "0.22.1"
# Local-time schedule math (weekday/time-of-day recurrences across DST). Already in the
# lockfile via rmcp; `clock` adds the OS time-zone lookup.
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"], optional = true }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"], optional = true }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
], optional = true }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDataProvider",
    "CGImage",
    "CGPDFDocument",
    "CGPDFPage",
], optional = true }
objc2-image-io = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGImageDestination",
    "objc2-core-graphics",
], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", optional = true }
windows = { version = "=0.62.2", features = [
    "Data_Pdf",
    "Foundation",
    "Graphics_Imaging",
    "Storage_Streams",
    "UI",
    "Win32_System_WinRT",
], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls-pki-types = "1.15.1"
# Decodes rendered PDF pages in the rasterizer tests. Already in the lockfile via Tauri.
png = "=0.18.1"
rcgen = { version = "=0.14.7", default-features = false, features = ["ring", "pem"] }
