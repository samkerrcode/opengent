[workspace]
resolver = "2"
members = ["crates/agent-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# rustls with the pure-Rust `ring` provider: avoids the aws-lc C/asm build and its linker
# warnings on older macOS toolchains. The provider is installed by `agent_core::http::init()`.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
uuid = { version = "1.28.0", default-features = false }
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1
